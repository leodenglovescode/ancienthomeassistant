name: Ancient Home Assistant
version: "1.0.0"
slug: ancient_dashboard
description: Lightweight dashboard for older iPads, powered by Ancient Home Assistant.
url: https://github.com/leodenglovescode/ancienthomeassistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
init: true
webui: "http://[HOST]:[PORT:8095]"
watchdog: "http://[HOST]:[PORT:8095]/api/status"
ports:
  8095/tcp: 7654
ports_description:
  8095/tcp: Dashboard web interface for your local network
options: {}
schema: {}
